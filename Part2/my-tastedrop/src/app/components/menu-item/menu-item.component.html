<div class="card shadow-sm h-100 border-0 rounded-4 overflow-hidden position-relative item-card">
  
  <div class="position-absolute top-0 start-0 m-3" [ngSwitch]="item.category" style="z-index: 3;">
    <span *ngSwitchCase="'Starters'" class="badge bg-info text-dark rounded-pill px-3 py-2 shadow-sm">Starters</span>
    <span *ngSwitchCase="'Main Course'" class="badge bg-success rounded-pill px-3 py-2 shadow-sm">Main Course</span>
    <span *ngSwitchCase="'Pizza'" class="badge bg-danger rounded-pill px-3 py-2 shadow-sm">Pizza</span>
    <span *ngSwitchCase="'Burgers'" class="badge bg-primary rounded-pill px-3 py-2 shadow-sm">Burgers</span>
    <span *ngSwitchCase="'Desserts'" class="badge bg-warning text-dark rounded-pill px-3 py-2 shadow-sm">Desserts</span>
    <span *ngSwitchDefault class="badge bg-secondary rounded-pill px-3 py-2 shadow-sm">{{item.category}}</span>
  </div>

  <div class="rating-badge shadow-sm">
    <i class="bi bi-star-fill text-warning"></i> {{item.rating}}
  </div>

  <img [src]="item.image" class="card-img-top" style="height: 200px; object-fit: cover;">
  
  <div *ngIf="!item.available" 
       class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" 
       style="background: rgba(0,0,0,0.75); z-index: 5;">
    <span class="badge bg-light text-dark fs-5 fw-bold px-4 py-2 rounded-pill shadow">Out of Stock</span>
  </div>

  <div class="card-body text-center d-flex flex-column mt-2">
    <h5 class="card-title fw-bold">{{item.name}}</h5>
    <p class="card-text text-muted small flex-grow-1">{{item.description}}</p>
    <p class="text-primary fw-bold fs-4">OMR {{item.price | number:'1.3-3'}}</p>

    <div class="mt-auto">
      <button *ngIf="getQuantity() === 0" 
              class="btn btn-warning w-100 rounded-pill fw-bold" 
              (click)="onAdd($event)" 
              [disabled]="!item.available">
        <i class="bi bi-cart-plus me-2"></i> Add to Cart
      </button>

      <div *ngIf="getQuantity() > 0" 
           class="d-flex justify-content-between align-items-center bg-light rounded-pill p-1 border shadow-sm">
        <button class="btn btn-white rounded-circle shadow-sm" (click)="onRemove($event)">
          <i class="bi bi-dash-lg text-danger"></i>
        </button>
        <span class="fw-bold fs-5">{{ getQuantity() }}</span>
        <button class="btn btn-white rounded-circle shadow-sm" (click)="onAdd($event)">
          <i class="bi bi-plus-lg text-success"></i>
        </button>
      </div>
    </div>
  </div>
</div>
