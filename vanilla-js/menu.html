<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | TasteDrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm bg-white" id="mainNav">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html">
                TasteDrop <span class="text-primary">■■</span>
            </a>
            <div class="d-flex align-items-center ms-auto gap-3">
                <a href="index.html" class="btn btn-outline-secondary rounded-pill px-3 btn-sm fw-medium d-none d-md-inline-block">
                    <i class="bi bi-house-door me-1"></i> Back to Home
                </a>
                <button class="btn btn-link nav-link shadow-none" id="darkModeToggle">
                    <i class="bi bi-moon-stars-fill fs-5"></i>
                </button>
                <a href="cart.html" class="btn btn-primary position-relative rounded-pill px-3">
                    <i class="bi bi-cart3"></i>
                    <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <header class="text-center mb-5 mt-4">
            <h1 class="fw-bold display-5">Our Delicious Menu</h1>
            <p class="text-muted">Freshly prepared meals delivered to your doorstep</p>
        </header>

        <div class="row g-3 mb-4 justify-content-center">
            <div class="col-md-6">
                <div class="input-group shadow-sm rounded-pill overflow-hidden">
                    <span class="input-group-text bg-white border-end-0 px-3">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="text" id="menuSearch" class="form-control border-start-0 py-2" placeholder="Search for dishes...">
                </div>
            </div>
            <div class="col-md-3">
                <select id="sortSelect" class="form-select rounded-pill shadow-sm py-2">
                    <option value="default">Price: Default</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                </select>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2 mb-5 flex-wrap" id="filterButtons">
            <button class="btn btn-primary rounded-pill px-4 filter-btn active" data-category="all">All</button>
            <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-category="Starters">Starters</button>
            <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-category="Main Course">Main Course</button>
            <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-category="Burgers">Burgers</button>
            <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-category="Pizza">Pizza</button>
            <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-category="Desserts">Desserts</button>
            <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-category="Drinks">Drinks</button>
        </div>

        <div class="row g-4" id="menuContainer">
            </div>
    </div>

    <footer class="mt-5 py-4">
        <div class="container text-center text-md-start">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <h5 class="fw-bold">TasteDrop ■■</h5>
                    <p id="footer-address" class="small text-muted mb-1">Loading address...</p>
                    <p id="footer-phone" class="small text-muted mb-1">Loading phone...</p>
                    <p id="footer-email" class="small text-muted">Loading email...</p>
                </div>
                <div class="col-md-4 mb-3 text-center">
                    <h5 class="fw-bold">Delivery Hours</h5>
                    <p id="footer-hours" class="small text-muted">Loading hours...</p>
                </div>
                <div class="col-md-4 mb-3 text-md-end">
                    <h5 class="fw-bold">Follow Us</h5>
                    <div class="d-flex justify-content-center justify-content-md-end gap-3">
                        <i class="bi bi-facebook fs-5"></i>
                        <i class="bi bi-instagram fs-5"></i>
                        <i class="bi bi-twitter fs-5"></i>
                    </div>
                </div>
            </div>
            <hr class="my-4 border-secondary">
            <p class="text-center small text-muted">&copy; 2026 TasteDrop Kitchen. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
